<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crispy-Eatery | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #12161A;
            color: #F8F9FA;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .landing-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }
        .brand-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .brand-header h1 {
            font-weight: 700;
        }
        .auth-box {
            background-color: #1C2227;
            border: 1px solid #2C353F;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
        }
        .auth-box input {
            background-color: #12161A;
            border: 1px solid #2C353F;
            color: #F8F9FA;
            border-radius: 8px;
            padding: 10px 14px;
            width: 100%;
            margin-bottom: 12px;
        }
        .auth-box input::placeholder { color: #7a8290; }
        .auth-box a { color: #FF8E53; cursor: pointer; }
        .btn-checkout {
            background: linear-gradient(135deg, #FF6B08 0%, #FF8E53 100%);
            border: none;
            color: white;
            font-weight: 600;
            padding: 12px;
            border-radius: 12px;
            width: 100%;
            box-shadow: 0 5px 15px rgba(255, 107, 8, 0.3);
            transition: all 0.3s;
        }
        .btn-checkout:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 107, 8, 0.5);
        }
        .btn-skip {
            background-color: transparent;
            border: 1px solid #2C353F;
            color: #F8F9FA;
            font-weight: 600;
            padding: 12px;
            border-radius: 12px;
            width: 100%;
            transition: all 0.2s;
        }
        .btn-skip:hover {
            background-color: #1C2227;
            border-color: #3D4A58;
            color: white;
        }
    </style>
</head>
<body>

    <div class="landing-wrapper">
        <div class="brand-header">
            <h1>Crispy-Eatery 🍔</h1>
            <p class="text-white-50">Premium items delivered straight to your workstation.</p>
        </div>

        <div class="auth-box" id="login-form">
            <h5 class="fw-bold mb-3">Login</h5>
            <input type="text" id="login-number" placeholder="Phone number">
            <input type="password" id="login-password" placeholder="Password">
            <button class="btn-checkout" onclick="handleLogin()">Login</button>
            <p class="mt-3 mb-0 text-center">No account? <a onclick="showSignup()">Sign up</a></p>
        </div>

        <div class="auth-box" id="signup-form" style="display:none;">
            <h5 class="fw-bold mb-3">Sign Up</h5>
            <input type="text" id="signup-first-name" placeholder="First name">
            <input type="text" id="signup-last-name" placeholder="Last name">
            <input type="text" id="signup-number" placeholder="Phone number">
            <input type="password" id="signup-password" placeholder="Password">
            <button class="btn-checkout" onclick="handleSignup()">Sign Up</button>
            <p class="mt-3 mb-0 text-center">Already have an account? <a onclick="showLogin()">Login</a></p>
        </div>

        <button class="btn-skip" onclick="window.location.href='/menu'">Browse menu without logging in →</button>
    </div>

    <script>
        function showSignup() {
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('signup-form').style.display = 'block';
        }

        function showLogin() {
            document.getElementById('signup-form').style.display = 'none';
            document.getElementById('login-form').style.display = 'block';
        }

        async function handleLogin() {
            const number = document.getElementById('login-number').value;
            const password = document.getElementById('login-password').value;

            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ number, password })
            });
            const result = await response.json();

            if (result.status === 'success') {
                window.location.href = '/menu';
            } else {
                alert(result.message || 'Login failed');
            }
        }

        async function handleSignup() {
            const first_name = document.getElementById('signup-first-name').value;
            const last_name = document.getElementById('signup-last-name').value;
            const number = document.getElementById('signup-number').value;
            const password = document.getElementById('signup-password').value;

            const response = await fetch('/api/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ first_name, last_name, number, password })
            });
            const result = await response.json();

            if (result.status === 'success') {
                alert('Account created! Please log in.');
                showLogin();
            } else {
                alert(result.message || 'Signup failed');
            }
        }
    </script>
</body>
</html>
