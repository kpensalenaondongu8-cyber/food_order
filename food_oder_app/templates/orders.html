<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | Crispy-Eatery</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #12161A;
            color: #F8F9FA;
        }
        .top-nav {
            background-color: #1C2227;
            border-bottom: 1px solid #2C353F;
            padding: 16px 0;
            margin-bottom: 30px;
        }
        .btn-back {
            background-color: #2C353F;
            color: white;
            border: none;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn-back:hover {
            background-color: #3D4A58;
            color: white;
        }
        .order-card {
            background-color: #1C2227;
            border: 1px solid #2C353F;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .order-header {
            border-bottom: 1px solid #2C353F;
            padding-bottom: 12px;
            margin-bottom: 12px;
        }
        .order-date {
            color: #9aa3ad;
            font-size: 0.9rem;
        }
        .order-total {
            color: #FF8E53;
            font-weight: 700;
            font-size: 1.2rem;
        }
        .item-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            color: #d0d5db;
        }
        .item-name {
            font-weight: 600;
            color: #F8F9FA;
        }
    </style>
</head>
<body>

    <nav class="top-nav">
        <div class="container d-flex justify-content-between align-items-center">
            <h4 class="fw-bold mb-0">My Orders 📜</h4>
            <a href="/home" class="btn-back">← Back to Menu</a>
        </div>
    </nav>

    <div class="container mb-5">
        <div id="orders-container"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', fetchOrders);

        async function fetchOrders() {
            const response = await fetch('/api/orders');

            if (response.status === 401) {
                window.location.href = '/login';
                return;
            }

            const orders = await response.json();
            const container = document.getElementById('orders-container');

            if (orders.length === 0) {
                container.innerHTML = '<p class="text-muted text-center py-5">You haven\'t placed any orders yet. <a href="/home" class="text-warning">Go order something tasty.</a></p>';
                return;
            }

            container.innerHTML = '';

            orders.forEach(order => {
                // Format the ISO timestamp into something more readable
                const date = new Date(order.created_at);
                const formattedDate = date.toLocaleString('en-US', {
                    year: 'numeric', month: 'short', day: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                });

                let itemsHtml = '';
                order.items.forEach(item => {
                    // item is a plain list: [food_name, quantity, price_bought]
                    const foodName = item[0];
                    const quantity = item[1];
                    const priceBought = item[2];
                    const lineTotal = quantity * priceBought;

                    itemsHtml += `
                        <div class="item-row">
                            <span><span class="item-name">${foodName}</span> × ${quantity}</span>
                            <span>$${lineTotal.toFixed(2)}</span>
                        </div>
                    `;
                });

                container.innerHTML += `
                    <div class="order-card">
                        <div class="order-header d-flex justify-content-between align-items-center">
                            <div>
                                <div class="fw-bold">Order #${order.order_id}</div>
                                <div class="order-date">${formattedDate}</div>
                            </div>
                            <div class="order-total">$${order.total.toFixed(2)}</div>
                        </div>
                        ${itemsHtml}
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
