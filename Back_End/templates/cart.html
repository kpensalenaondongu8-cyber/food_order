<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | Crispy-Eatery</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #12161A;
            color: #F8F9FA;
        }
        .top-nav {
            background-color: #1C2227;
            border-bottom: 1px solid #2C353F;
            padding: 16px 0;
            margin-bottom: 30px;
        }
        .btn-back {
            background-color: #2C353F;
            color: white;
            border: none;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn-back:hover {
            background-color: #3D4A58;
            color: white;
        }
        .cart-row {
            background-color: #1C2227;
            border: 1px solid #2C353F;
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .cart-img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 14px;
        }
        .btn-action {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border: none;
            transition: all 0.2s;
        }
        .btn-plus { background-color: #FF6B08; color: white; }
        .btn-plus:hover { background-color: #E05A00; }
        .btn-minus { background-color: #2C353F; color: #FFF; border: 1px solid #3D4A58; }
        .btn-minus:hover { background-color: #3D4A58; }
        .btn-remove {
            background-color: #3D1F1F;
            color: #FF6B6B;
            border: none;
        }
        .btn-remove:hover { background-color: #522A2A; }
        .price-tag {
            font-weight: 700;
            color: #FF8E53;
        }
        .summary-card {
            background-color: #1C2227;
            border: 1px solid #2C353F;
            border-radius: 20px;
            padding: 25px;
        }
        .btn-checkout {
            background: linear-gradient(135deg, #FF6B08 0%, #FF8E53 100%);
            border: none;
            color: white;
            font-weight: 600;
            padding: 14px;
            border-radius: 14px;
            box-shadow: 0 5px 15px rgba(255, 107, 8, 0.3);
            transition: all 0.3s;
        }
        .btn-checkout:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 107, 8, 0.5);
        }
    </style>
</head>
<body>

    <nav class="top-nav">
        <div class="container d-flex justify-content-between align-items-center">
            <h4 class="fw-bold mb-0">Your Cart 🛒</h4>
            <a href="/" class="btn-back">← Back to Menu</a>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="row">
            <div class="col-md-8">
                <div id="cart-items-container">
                </div>
            </div>
            <div class="col-md-4">
                <div class="summary-card">
                    <h4 class="fw-bold mb-4">Order Summary</h4>
                    <div class="d-flex justify-content-between mb-3">
                        <span class="text-muted">Items</span>
                        <span id="summary-count" class="fw-bold">0</span>
                    </div>
                    <div class="d-flex justify-content-between mb-4 pb-3 border-bottom border-secondary">
                        <span class="fs-5 fw-bold">Total</span>
                        <span id="summary-total" class="fs-5 fw-bold text-warning">$0.00</span>
                    </div>
                    <button class="btn btn-checkout w-100" onclick="triggerCheckout()">Place Order Now</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/dish-images.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', fetchCart);

        async function fetchCart() {
            const response = await fetch('/api/cart');
            const cartData = await response.json();
            const container = document.getElementById('cart-items-container');

            if (Object.keys(cartData).length === 0) {
                container.innerHTML = '<p class="text-muted text-center py-5">Your cart is empty. <a href="/" class="text-warning">Go add something tasty.</a></p>';
                document.getElementById('summary-count').innerText = '0';
                document.getElementById('summary-total').innerText = '$0.00';
                return;
            }

            container.innerHTML = '';
            let grandTotal = 0;
            let totalItems = 0;

            for (const [name, details] of Object.entries(cartData)) {
                const subtotal = details.quantity * details.price_per_unit;
                grandTotal += subtotal;
                totalItems += details.quantity;
                const imgUrl = getDishImage(name);

                container.innerHTML += `
                    <div class="cart-row d-flex align-items-center gap-3">
                        <img src="${imgUrl}" class="cart-img" alt="${name}">
                        <div class="flex-grow-1">
                            <h6 class="fw-bold mb-1">${name}</h6>
                            <span class="price-tag">$${details.price_per_unit.toFixed(2)}</span>
                            <span class="text-muted"> each</span>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <button class="btn-action btn-minus" onclick="updateCart('${name}', 'decrease')">−</button>
                            <span class="fw-bold" style="min-width: 20px; text-align: center;">${details.quantity}</span>
                            <button class="btn-action btn-plus" onclick="updateCart('${name}', 'increase')">+</button>
                        </div>
                        <div class="fw-bold" style="min-width: 70px; text-align: right;">$${subtotal.toFixed(2)}</div>
                        <button class="btn-action btn-remove" onclick="removeFromCart('${name}')">✕</button>
                    </div>
                `;
            }

            document.getElementById('summary-count').innerText = totalItems;
            document.getElementById('summary-total').innerText = `$${grandTotal.toFixed(2)}`;
        }

        async function updateCart(itemName, actionType) {
            await fetch('/api/cart/modify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ item: itemName, action: actionType, amount: 1 })
            });
            fetchCart();
        }

        async function removeFromCart(itemName) {
            await fetch('/api/cart/remove', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ item: itemName })
            });
            fetchCart();
        }

        function triggerCheckout() {
            fetch('/api/checkout', { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    alert(data.message || `Order placed! Total charged: $${data.total_charged?.toFixed ? data.total_charged.toFixed(2) : data.total_charged}`);
                    fetchCart();
                })
                .catch(err => console.error('Checkout failed:', err));
        }
    </script>
</body>
</html>
