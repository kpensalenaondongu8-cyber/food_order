<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crispy-Eatery | Gourmet Delivery</title>
    <!-- Premium Google Fonts -->
    <link href="https://googleapis.com" rel="stylesheet">
    <!-- Bootstrap Styling Grid -->
    <link rel="stylesheet" href="https://jsdelivr.net">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #12161A;
            color: #F8F9FA;
        }
        .hero-banner {
            background: linear-gradient(135deg, #FF6B08 0%, #FF8E53 100%);
            border-radius: 24px;
            padding: 40px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(255, 107, 8, 0.2);
        }
        .category-header {
            color: #FF6B08;
            font-weight: 700;
            border-left: 5px solid #FF6B08;
            padding-left: 15px;
            margin-top: 35px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .food-card {
            background-color: #1C2227;
            border: 1px solid #2C353F;
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .food-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.4);
            border-color: #FF6B08;
        }
        .food-img-wrapper {
            height: 200px;
            overflow: hidden;
            position: relative;
        }
        .food-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .food-card:hover .food-img {
            transform: scale(1.1);
        }
        .stock-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: rgba(0, 0, 0, 0.7);
            color: #FFF;
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 0.75rem;
            backdrop-filter: blur(5px);
        }
        .price-tag {
            font-size: 1.3rem;
            font-weight: 700;
            color: #FF8E53;
        }
        .btn-action {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            border: none;
            transition: all 0.2s;
        }
        .btn-plus { background-color: #FF6B08; color: white; }
        .btn-plus:hover { background-color: #E05A00; }
        .btn-minus { background-color: #2C353F; color: #FFF; }
        .btn-minus:hover { background-color: #3D4A58; }
        .cart-sidebar {
            background-color: #1C2227;
            border: 1px solid #2C353F;
            border-radius: 24px;
            padding: 25px;
            position: sticky;
            top: 30px;
        }
        .cart-item {
            border-bottom: 1px solid #2C353F;
            padding-bottom: 12px;
            margin-bottom: 12px;
        }
        .btn-checkout {
            background: linear-gradient(135deg, #FF6B08 0%, #FF8E53 100%);
            border: none;
            color: white;
            font-weight: 600;
            padding: 14px;
            border-radius: 14px;
            box-shadow: 0 5px 15px rgba(255, 107, 8, 0.3);
            transition: all 0.3s;
        }
        .btn-checkout:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 107, 8, 0.5);
        }
    </style>
</head>
<body>

    <div class="container my-5">
        <!-- Dashboard Premium Banner Header -->
        <div class="hero-banner text-white">
            <h1 class="fw-bold display-5">Crispy-Deliveries 🍔</h1>
            <p class="lead mb-0 fs-5 text-white-50">Premium items delivered straight to your workstation.</p>
        </div>
        
        <div class="row">
            <!-- Left Panel: Grid Storefront Layout -->
            <div class="col-md-8">
                <div id="menu-container">
                    <!-- Loaded dynamically via javascript -->
                </div>
            </div>
            
            <!-- Right Panel: Sticky Modern Interactive Invoice Summary -->
            <div class="col-md-4">
                <div class="cart-sidebar shadow">
                    <h3 class="fw-bold mb-4 d-flex justify-content-between align-items-center">
                        <span>Your Tray</span>
                        <span class="badge bg-warning text-dark fs-6 rounded-pill" id="cart-count-badge">0</span>
                    </h3>
                    <div id="cart-container">
                        <p class="text-muted text-center py-4">Your tray is currently empty.</p>
                    </div>
                    <button class="btn btn-checkout w-100 mt-3" onclick="triggerCheckout()">Place Order Now</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Mapping food names directly to dynamic food pictures
        const fallbackImages = {
            "Garlic Bread": "https://unsplash.com",
            "Stuffed Mushrooms": "https://unsplash.com",
            "Classic Cheeseburger": "https://unsplash.com",
            "Grilled Salmon": "https://unsplash.com",
            "Margherita Pizza": "https://unsplash.com",
            "Iced Coffee": "https://unsplash.com",
            "Fresh Lemonade": "https://unsplash.com",
            "Hennessey": "https://unsplash.com"
        };

        async function fetchMenu() {
            const response = await fetch('/api/menu');
            const data = await response.json();
            const container = document.getElementById('menu-container');
            container.innerHTML = '';

            for (const [category, items] of Object.entries(data.categories)) {
                container.innerHTML += `<h3 class="category-header">${category.replace('_', ' ')}</h3>`;
                
                let rowHtml = '<div class="row g-4">';
                items.forEach(dish => {
                    const imgUrl = fallbackImages[dish.name] || "https://unsplash.com";
                    rowHtml += `
                        <div class="col-md-6">
                            <div class="food-card">
                                <div class="food-img-wrapper">
                                    <img src="${imgUrl}" class="food-img" alt="${dish.name}">
                                    <span class="stock-badge">Stock: ${dish.quantity} left</span>
                                </div>
                                <div class="p-4">
                                    <h5 class="fw-bold mb-1">${dish.name}</h5>
                                    <div class="d-flex justify-content-between align-items-center mt-3">
                                        <span class="price-tag">$${dish.price.toFixed(2)}</span>
                                        <div class="d-flex gap-2">
                                            <button class="btn-action btn-minus" onclick="updateCart('${dish.name}', 'decrease')">−</button>
                                            <button class="btn-action btn-plus" onclick="updateCart('${dish.name}', 'increase')">+</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
                rowHtml += '</div>';
                container.innerHTML += rowHtml;
            }
        }

        async function updateCart(itemName, actionType) {
            await fetch('/api/cart/modify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ item: itemName, action: actionType, amount: 1 })
            });
            fetchCart();
        }

        async function fetchCart() {
            const response = await fetch('/api/cart');
            const cartData = await response.json();
            const container = document.getElementById('cart-container');
            const badge = document.getElementById('cart-count-badge');
            
            let totalItems = 0;
            if (Object.keys(cartData).length === 0) {
                container.innerHTML = '<p class="text-muted text-center py-4">Your tray is currently empty.</p>';
                badge.innerText = '0';
                return;
            }

            container.innerHTML = '';
            let grandTotal = 0;

            for (const [name, details] of Object.entries(cartData)) {
                let subtotal = details.quantity * details.price_per_unit;
                grandTotal += subtotal;
                totalItems += details.quantity;
                
                container.innerHTML += `
                    <div class="cart-item d-flex justify-content-between align-items-center">
                        <div>
